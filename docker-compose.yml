version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:5.0
    container_name: booking_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - booking_network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: booking_api
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://admin:password123@mongodb:27017/booking?authSource=admin
    depends_on:
      - mongodb
    networks:
      - booking_network

  # Frontend Client
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: booking_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - booking_network

volumes:
  mongodb_data:

networks:
  booking_network:
    driver: bridge